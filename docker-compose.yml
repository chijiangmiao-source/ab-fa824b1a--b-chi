services:
  web:
    build: .
    image: buchi-verify:latest
    environment:
      PORT: "8080"
    ports:
      # 宿主机端口可通过环境变量 HOST_PORT 配置，默认 8080
      - "${HOST_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD", "python", "scripts/verify_smoke.py", "http://127.0.0.1:8080/healthz"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 3s

  # 一次性验收任务：代码测试 + 构建检查 + 健康地址 HTTP 冒烟；
  # 结束后退出，退出码即验收结果（0 通过，非 0 失败）。
  verify:
    build: .
    image: buchi-verify:latest
    depends_on:
      web:
        condition: service_healthy
    command: ["sh", "scripts/verify.sh"]
    environment:
      WEB_HEALTH_URL: "http://web:8080/healthz"
    restart: "no"
